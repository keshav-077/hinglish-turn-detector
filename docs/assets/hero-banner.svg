<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-label="Low-latency voice AI turn detection banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="960" height="200" fill="url(#bg)"/>
  <text x="48" y="72" fill="#e2e8f0" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Whisper Tiny · Dual-Scale Attention</text>
  <text x="48" y="108" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Audio-native end-of-turn detection for Hindi &amp; English · &lt;50 ms CPU inference</text>
  <g transform="translate(48,130)">
    <rect x="0" y="0" width="864" height="48" rx="8" fill="#1e293b" opacity="0.6"/>
    <g id="bars">
      <rect x="12" y="24" width="6" height="20" rx="2" fill="url(#bar)"><animate attributeName="height" values="20;36;20" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="24;8;24" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="28" y="16" width="6" height="28" rx="2" fill="url(#bar)"><animate attributeName="height" values="28;40;28" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;4;16" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="44" y="20" width="6" height="24" rx="2" fill="url(#bar)"><animate attributeName="height" values="24;38;24" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="20;6;20" dur="0.85s" repeatCount="indefinite"/></rect>
      <rect x="60" y="12" width="6" height="32" rx="2" fill="url(#bar)"><animate attributeName="height" values="32;44;32" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="12;0;12" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="76" y="22" width="6" height="22" rx="2" fill="url(#bar)"><animate attributeName="height" values="22;34;22" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="22;10;22" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect x="92" y="18" width="6" height="26" rx="2" fill="url(#bar)"><animate attributeName="height" values="26;40;26" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="18;4;18" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="108" y="26" width="6" height="18" rx="2" fill="url(#bar)"><animate attributeName="height" values="18;30;18" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="26;14;26" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="124" y="14" width="6" height="30" rx="2" fill="url(#bar)"><animate attributeName="height" values="30;42;30" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="14;2;14" dur="1.15s" repeatCount="indefinite"/></rect>
    </g>
    <path d="M160 36 L820 36" stroke="#334155" stroke-width="1" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="820" cy="36" r="8" fill="#22d3ee">
      <animate attributeName="r" values="8;10;8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="836" y="41" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="600">COMPLETE</text>
  </g>
</svg>
