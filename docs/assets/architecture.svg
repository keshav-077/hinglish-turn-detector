  <text x="40" y="248" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Training-only: auxiliary filler head (mid / end). Exported ONNX: input_features [B,80,800], frame_mask [B,800] ’ p_complete [B,1].</text>
  <text x="40" y="268" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Deployed: dynamic INT8 · 10.16 MiB · calibrated threshold 0.38 · temperature 2.5522 · 300 ms silence · 1000 ms timeout.</text>
