  <rect width="920" height="320" rx="12" fill="#0f172a"/>
  <text x="460" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Dual-scale turn detector (inference graph)</text>
